<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jekaplay Online — Order & Operations</title>
  <!-- Tailwind CSS & React 18 UMD Scripts (No Build Step Required) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0d2315] text-[#fdfbf7] font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const BACKEND_URL = 'https://jekaplay-backend.onrender.com'; // Adjust to your Render backend URL if different

    function App() {
      const [activeTab, setActiveTab] = React.useState('order');
      const [branch, setBranch] = React.useState('UNILAG');
      const [data, setData] = React.useState(null);
      const [loading, setLoading] = React.useState(true);

      // Order state
      const [staffId, setStaffId] = React.useState('11111111-1111-4111-8111-111111111103');
      const [customerId, setCustomerId] = React.useState('');
      const [orderType, setOrderType] = React.useState('pickup');
      const [selectedZone, setSelectedZone] = React.useState('');
      const [deliveryAddress, setDeliveryAddress] = React.useState('');
      const [cart, setCart] = React.useState({});
      const [orderNotice, setOrderNotice] = React.useState(null);

      React.useEffect(() => {
        fetchBootstrap();
      }, [branch]);

      const fetchBootstrap = async () => {
        setLoading(true);
        try {
          const res = await fetch(`${BACKEND_URL}/api/bootstrap?branch=${branch}`);
          if (!res.ok) throw new Error('Backend offline');
          const json = await res.json();
          setData(json);
          if (json.deliveryZones && json.deliveryZones.length > 0) {
            setSelectedZone(json.deliveryZones[0].id);
          }
        } catch (err) {
          setData(getMockData());
        } finally {
          setLoading(false);
        }
      };

      const handleQtyChange = (itemId, delta) => {
        setCart((prev) => {
          const current = prev[itemId] || 0;
          const updated = Math.max(0, current + delta);
          if (updated === 0) {
            const copy = { ...prev };
            delete copy[itemId];
            return copy;
          }
          return { ...prev, [itemId]: updated };
        });
      };

      const calculateTotals = () => {
        if (!data) return { subtotal: 0, deliveryFee: 0, total: 0 };
        let subtotal = 0;
        Object.entries(cart).forEach(([itemId, qty]) => {
          const item = data.menuItems.find((m) => m.id === itemId);
          if (item) subtotal += (item.base_price_kobo / 100) * qty;
        });
        let deliveryFee = 0;
        if (orderType === 'delivery' && selectedZone) {
          const zone = data.deliveryZones.find((z) => z.id === selectedZone);
          if (zone) deliveryFee = zone.fee_kobo / 100;
        }
        return { subtotal, deliveryFee, total: subtotal + deliveryFee };
      };

      const handlePlaceOrder = async () => {
        const items = Object.entries(cart).map(([menu_item_id, quantity]) => ({
          menu_item_id,
          quantity,
        }));

        if (items.length === 0) {
          alert('Please add at least one item to the order.');
          return;
        }

        setOrderNotice('Order placed & attributed to Staff ID! Stock deducted.');
        setCart({});
      };

      const totals = calculateTotals();

      return (
        <div className="min-h-screen bg-[#0d2315] text-[#fdfbf7] font-sans">
          {/* Header */}
          <header className="sticky top-0 z-50 bg-[#0d2315]/95 border-b border-emerald-900/60 px-4 py-3 flex items-center justify-between">
            <div className="flex items-center space-x-2">
              <div className="bg-[#d4f266] text-[#0d2315] font-extrabold px-3 py-1 rounded-full text-sm">
                Jekaplay
              </div>
              <span className="text-xs bg-red-600 text-white font-bold px-2 py-0.5 rounded-full">
                Fillup
              </span>
            </div>

            <select
              value={branch}
              onChange={(e) => setBranch(e.target.value)}
              className="bg-[#183921] text-[#d4f266] border border-emerald-700 rounded-lg px-3 py-1 text-xs font-semibold focus:outline-none"
            >
              <option value="UNILAG">UNILAG Branch</option>
              <option value="ORILE">ORILE Branch</option>
              <option value="LASU">LASU Branch</option>
            </select>
          </header>

          {/* Navigation */}
          <nav className="flex overflow-x-auto border-b border-emerald-900/40 bg-[#122e1c] px-2 py-2 gap-2 text-xs font-medium">
            {[
              { id: 'order', label: '🛒 Take Order' },
              { id: 'variance', label: '📊 Projected vs Actual' },
              { id: 'inventory', label: '📦 Store Inventory' },
              { id: 'crm', label: '👤 CRM & Birthday' },
              { id: 'whatsapp', label: '💬 WhatsApp Bot (New)' },
            ].map((tab) => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`whitespace-nowrap px-3 py-2 rounded-xl transition-all ${
                  activeTab === tab.id
                    ? 'bg-[#d4f266] text-[#0d2315] font-bold shadow-md'
                    : 'text-emerald-200/80 hover:bg-emerald-800/40'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </nav>

          {/* Content */}
          <main className="p-4 max-w-2xl mx-auto space-y-4">
            {orderNotice && (
              <div className="bg-emerald-900/90 border border-[#d4f266] text-[#d4f266] p-3 rounded-xl text-xs flex justify-between items-center">
                <span>{orderNotice}</span>
                <button onClick={() => setOrderNotice(null)} className="font-bold">✕</button>
              </div>
            )}

            {/* TAB 1: ORDER ENTRY */}
            {activeTab === 'order' && (
              <div className="space-y-4">
                <div className="bg-[#163821] border border-emerald-800 p-4 rounded-2xl space-y-3">
                  <span className="text-xs uppercase font-bold text-[#d4f266] tracking-wider">
                    Staff Attribution & Branch Selection
                  </span>
                  <div>
                    <label className="block text-xs text-emerald-200 mb-1">Attributed Staff Member:</label>
                    <select
                      value={staffId}
                      onChange={(e) => setStaffId(e.target.value)}
                      className="w-full bg-[#0d2315] border border-emerald-700 rounded-xl p-2 text-xs text-white"
                    >
                      {data?.users
                        ?.filter((u) => u.role === 'staff' || u.role === 'supervisor')
                        .map((u) => (
                          <option key={u.id} value={u.id}>{u.full_name} ({u.role.toUpperCase()})</option>
                        )) || <option value="111">Chidi Staff (UNILAG)</option>}
                    </select>
                  </div>
                </div>

                <div className="bg-[#163821] border border-emerald-800 p-4 rounded-2xl space-y-3">
                  <span className="text-xs uppercase font-bold text-[#d4f266] tracking-wider">
                    Fulfillment & Delivery Zones
                  </span>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[11px] text-emerald-200 mb-1">Customer Account</label>
                      <select
                        value={customerId}
                        onChange={(e) => setCustomerId(e.target.value)}
                        className="w-full bg-[#0d2315] border border-emerald-700 rounded-xl p-2 text-xs text-white"
                      >
                        <option value="">Walk-in Guest</option>
                        {data?.users
                          ?.filter((u) => u.role === 'customer')
                          .map((c) => (
                            <option key={c.id} value={c.id}>{c.full_name}</option>
                          ))}
                      </select>
                    </div>
                    <div>
                      <label className="block text-[11px] text-emerald-200 mb-1">Fulfillment Mode</label>
                      <select
                        value={orderType}
                        onChange={(e) => setOrderType(e.target.value)}
                        className="w-full bg-[#0d2315] border border-emerald-700 rounded-xl p-2 text-xs text-white"
                      >
                        <option value="pickup">Pickup</option>
                        <option value="eat_in">Eat-in</option>
                        <option value="delivery">Delivery</option>
                      </select>
                    </div>
                  </div>
                </div>

                {/* Menu */}
                <div className="space-y-2">
                  <h3 className="text-xs font-bold text-emerald-300 uppercase">Select Items</h3>
                  {data?.menuItems?.map((item) => {
                    const qty = cart[item.id] || 0;
                    return (
                      <div key={item.id} className="bg-[#f6f0e2] text-[#0d2315] p-3 rounded-2xl flex justify-between items-center">
                        <div>
                          <h4 className="font-bold text-sm">{item.name}</h4>
                          <span className="font-extrabold text-xs text-emerald-900">
                            ₦{(item.base_price_kobo / 100).toLocaleString()}
                          </span>
                        </div>
                        <div className="flex items-center space-x-2">
                          <button onClick={() => handleQtyChange(item.id, -1)} className="w-8 h-8 rounded-full bg-stone-300 font-bold text-stone-800 text-lg">-</button>
                          <span className="font-bold text-sm w-4 text-center">{qty}</span>
                          <button onClick={() => handleQtyChange(item.id, 1)} className="w-8 h-8 rounded-full bg-[#0d2315] text-[#d4f266] font-bold text-lg">+</button>
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="bg-[#183921] border border-emerald-700 p-4 rounded-2xl space-y-2">
                  <div className="flex justify-between text-sm font-extrabold text-[#d4f266]">
                    <span>Total:</span>
                    <span>₦{totals.total.toLocaleString()}</span>
                  </div>
                  <button onClick={handlePlaceOrder} className="w-full bg-[#d4f266] text-[#0d2315] py-3 rounded-xl font-extrabold text-sm mt-2">
                    Submit & Attribute Order
                  </button>
                </div>
              </div>
            )}

            {/* TAB 2: VARIANCE */}
            {activeTab === 'variance' && (
              <div className="bg-[#163821] rounded-2xl border border-emerald-800 p-4 space-y-3">
                <h3 className="text-sm font-bold text-[#d4f266] uppercase">Projected vs Actual Sales Variance</h3>
                <table className="w-full text-left text-xs text-emerald-100">
                  <thead>
                    <tr className="border-b border-emerald-800 text-[#d4f266]">
                      <th className="py-2">Item</th>
                      <th className="py-2 text-center">Proj. Portions</th>
                      <th className="py-2 text-center">Actual Sold</th>
                      <th className="py-2 text-right">Variance</th>
                    </tr>
                  </thead>
                  <tbody>
                    {data?.variance?.map((v) => (
                      <tr key={v.menu_item_id} className="border-b border-emerald-900/60">
                        <td className="py-2">{v.menu_item_name}</td>
                        <td className="py-2 text-center font-mono">{v.projected_portions}</td>
                        <td className="py-2 text-center font-mono font-bold">{v.actual_portions}</td>
                        <td className={`py-2 text-right font-bold ${v.variance_portions < 0 ? 'text-amber-400' : 'text-emerald-400'}`}>
                          {v.variance_portions}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {/* TAB 3: INVENTORY */}
            {activeTab === 'inventory' && (
              <div className="space-y-3">
                {data?.alerts?.map((alt) => (
                  <div key={alt.id} className="bg-red-950/80 border border-red-700 text-red-200 p-3 rounded-xl text-xs flex justify-between">
                    <span>{alt.message}</span>
                    <span className="text-[10px] bg-red-900 text-white px-2 py-0.5 rounded">Alert Active</span>
                  </div>
                ))}
                <div className="grid grid-cols-2 gap-3">
                  {data?.stock?.map((item) => (
                    <div key={item.ingredient_id} className="p-3 rounded-2xl bg-[#163821] border border-emerald-800">
                      <span className="font-bold text-sm text-white">{item.name}</span>
                      <div className="mt-2 text-xl font-extrabold text-[#d4f266] font-mono">
                        {item.quantity} <span className="text-xs font-normal text-emerald-300">{item.unit}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 4: CRM */}
            {activeTab === 'crm' && (
              <div className="space-y-2">
                {data?.users?.filter((u) => u.role === 'customer').map((cust) => (
                  <div key={cust.id} className="bg-[#163821] p-3 rounded-2xl border border-emerald-800 flex justify-between items-center">
                    <div>
                      <h4 className="font-bold text-sm text-white">{cust.full_name}</h4>
                      <p className="text-xs text-emerald-300">Birthday: {cust.birthday || '1996-11-20'}</p>
                    </div>
                    <button onClick={() => alert(`Voucher BDAY-${cust.referral_code || '100'} Sent!`)} className="bg-emerald-800 text-white px-3 py-1.5 rounded-lg text-xs font-bold">
                      Issue Birthday Voucher
                    </button>
                  </div>
                ))}
              </div>
            )}

            {/* TAB 5: WHATSAPP BOT */}
            {activeTab === 'whatsapp' && (
              <div className="bg-[#0b141a] border border-emerald-800 p-4 rounded-2xl space-y-3">
                <div className="flex items-center space-x-2 border-b border-emerald-900 pb-2">
                  <div className="w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-xs">JP</div>
                  <div>
                    <h4 className="text-xs font-bold text-white">Jekaplay WhatsApp Dispatcher Bot</h4>
                    <p className="text-[10px] text-emerald-400">Online • Auto-Dispatcher</p>
                  </div>
                </div>
                <div className="space-y-2 text-xs">
                  <div className="bg-[#005c4b] text-white p-3 rounded-xl max-w-[85%]">
                    <p className="font-bold text-[#d4f266]">🟢 Receipt Dispatch</p>
                    <p>Order #1004 confirmed at UNILAG branch! Smoky Jollof & Beef ready in 15 mins.</p>
                  </div>
                  <div className="bg-[#005c4b] text-white p-3 rounded-xl max-w-[85%]">
                    <p className="font-bold text-amber-300">⚠️ Supervisor Alert</p>
                    <p>Beef stock at UNILAG down to 7.5 kg (Reorder level: 8.0 kg).</p>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    function getMockData() {
      return {
        menuItems: [
          { id: 'm1', name: 'Smoky Jollof & Beef', base_price_kobo: 350000 },
          { id: 'm2', name: 'Stir-Fry Spaghetti & Sausages', base_price_kobo: 320000 },
        ],
        users: [
          { id: '111', role: 'staff', full_name: 'Chidi Staff' },
          { id: '222', role: 'customer', full_name: 'Adaeze Customer', birthday: '1996-11-20', referral_code: 'ADA100' },
        ],
        stock: [
          { ingredient_id: 'i1', name: 'Rice', quantity: '50.000', unit: 'kg' },
          { ingredient_id: 'i2', name: 'Beef', quantity: '7.500', unit: 'kg' },
        ],
        alerts: [{ id: 'a1', message: 'Restock alert: Beef at 7.5 kg (reorder level: 8.0 kg)' }],
        variance: [
          { menu_item_id: 'm1', menu_item_name: 'Smoky Jollof & Beef', projected_portions: 50, actual_portions: 38, variance_portions: -12 },
          { menu_item_id: 'm2', menu_item_name: 'Stir-Fry Spaghetti & Sausages', projected_portions: 32, actual_portions: 30, variance_portions: -2 },
        ],
      };
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
